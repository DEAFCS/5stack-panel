logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s

webrtc: yes
webrtcAddress: :8889

webrtcAllowOrigins: ["*"]

srt: yes
srtAddress: :8890

# Nothing publishes or reads over RTSP, RTMP or MoQ: the streamer pushes SRT
# and browsers use WHIP/WHEP. RTSP and MoQ are on by default, and with
# hostNetwork every listener here is a port taken on the node.
rtsp: no
rtmp: no
moq: no

pathDefaults:
  source: publisher
  sourceOnDemand: no

paths:
  all_others:
