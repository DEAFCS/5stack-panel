apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-parser
  namespace: 5stack
  labels:
    app: demo-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-parser
  template:
    metadata:
      labels:
        app: demo-parser
    spec:
      # Keep demo parsing off the CS2 node: parsing a demo burns a full core and
      # competes with the match servers there. Runs on the web node instead.
      nodeSelector:
        kubernetes.io/hostname: v2202608399636501351
      containers:
        - name: demo-parser
          image: ghcr.io/deafcs/demo-parser@sha256:b98549e50239dcfce37e8e3ed5505d993c1b70d794db4078c62f2ef1d252abdc
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
