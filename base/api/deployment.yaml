apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: 5stack
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: server-creator
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: 5stack-api
                operator: In
                values:
                  - "true"
      containers:
        # Pinned to what runs in production. :latest would let update.sh pull a
        # release nobody has tested. Bump the digest when the API is deployed.
        - image: ghcr.io/deafcs/api@sha256:bbb83f98613342c80aa42d3787cfdb4e74d7b7de201ced0eed136bf1c7e408a9
          name: api
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
          ports:
            - containerPort: 5585
          startupProbe:
            httpGet:
              path: /system/healthz
              port: 5585
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /system/healthz
              port: 5585
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 2
          livenessProbe:
            httpGet:
              path: /system/healthz
              port: 5585
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The game server images the API starts, pinned the same way.
            - name: SERVER_IMAGE
              value: ghcr.io/deafcs/game-server-sw@sha256:e1a6a5bf475dc4242957921e6a26deba4918cda6c5754b60b1d2ddc1904d60a9
            - name: PRACTICE_SERVER_IMAGE
              value: ghcr.io/deafcs/game-server-sw@sha256:ae127e0bf7230d856f91303e539917d007baffc0aa978a88f47beba668c285a4
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:  
                name: api-secrets
            - secretRef:  
                name: steam-secrets
            - secretRef:
                name: hasura-secrets
            - secretRef:  
                name: typesense-secrets
            - secretRef:
                name: discord-secrets
            - secretRef:
                name: redis-secrets
            - secretRef:
                name: timescaledb-secrets
            - secretRef:
                name: tailscale-secrets
            - secretRef:
                name: s3-secrets
            - configMapRef:
                name: s3-config
            - secretRef:
                name: faceit-secrets
            - secretRef:
                name: push-secrets
            # Created by hand in the cluster (kubectl create secret generic),
            # not by the local-secrets overlay: a generated secret would be
            # rewritten from an empty .env file on the next update.sh run.
            - secretRef:
                name: giphy-secrets
                optional: true
            - secretRef:
                name: twitch-secrets
                optional: true
            - secretRef:
                name: steam-gc-secrets
                optional: true